<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetBrief</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    h1 { margin: 0 0 4px; }
    .sub { color: #94a3b8; margin: 0 0 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; max-width: 420px; }
    .odds { display: flex; justify-content: space-between; margin: 12px 0; font-weight: bold; }
    .yes { color: #22c55e; }
    .no { color: #ef4444; }
    button { background: #3b82f6; color: white; border: 0; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>BetBrief</h1>
  <p class="sub">Extra context before you bet on sports markets</p>

  <div class="card">
    <h2>Bay City Hawks vs. Lakeview Wolves</h2>
    <p>Market: Will the Hawks win?</p>
    <div class="odds">
      <span class="yes">Yes 62¢</span>
      <span class="no">No 38¢</span>
    </div>

    <!-- NEW: button and hidden insights -->
    <button id="infoBtn">Show game insights</button>
    <div id="insights" hidden>
      <ul>
        <li>Hawks have won 4 of their last 5 games</li>
        <li>Wolves' starting QB is questionable (ankle)</li>
        <li>Hawks won the last 3 head-to-head matchups</li>
      </ul>
    </div>
  </div>

  <!-- NEW: makes the button work -->
  <script>
    const btn = document.getElementById('infoBtn');
    const box = document.getElementById('insights');
    btn.onclick = () => {
      box.hidden = !box.hidden;
      btn.textContent = box.hidden ? 'Show game insights' : 'Hide game insights';
    };
  </script>
</body>
</html>
